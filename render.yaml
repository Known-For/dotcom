services:
  - type: web
    name: knownfor-dotcom
    runtime: static
    # This file documents the live standalone service configuration.
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    pullRequestPreviewsEnabled: false
    headers:
      - path: /_next/static/**/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /brand/*
        name: Cache-Control
        value: public, max-age=2592000
      - path: /images/*
        name: Cache-Control
        value: public, max-age=2592000
      - path: /favicon.png
        name: Cache-Control
        value: public, max-age=2592000
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
